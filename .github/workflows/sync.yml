name: GAM Sync v1

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GAM_CLIENT_EMAIL: ${{ secrets.GAM_CLIENT_EMAIL }}
      GAM_PRIVATE_KEY: ${{ secrets.GAM_PRIVATE_KEY }}
      GAM_NETWORK_CODE: ${{ secrets.GAM_NETWORK_CODE }}

      BIGQUERY_ENABLED: "true"
      BIGQUERY_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID }}
      BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
      BIGQUERY_CREDENTIALS_JSON: ${{ secrets.BIGQUERY_CREDENTIALS_JSON }}
      BIGQUERY_LOCATION: ${{ secrets.BIGQUERY_LOCATION }}

      PREJOIN_CLEANUP_ENABLED: "false"
      RETENTION_CLEANUP_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync once
        run: python sync.py --once